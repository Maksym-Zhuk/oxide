# The `auth_server` tests used to be forced onto a single thread because the
# callback listener was hardcoded to 127.0.0.1:8080 and every nextest process
# raced to bind it. The listener now walks a range of ports
# (`auth::server::CALLBACK_PORTS`) and each test asks for the port it actually
# got, so no serialization is needed and the suite runs fully in parallel.
#
# The range is 10 ports wide, so `nextest` must not run more than that many
# `auth_server` tests at once — with 5 tests in the binary there is ample slack.
