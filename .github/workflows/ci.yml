name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    schedule:
        - cron: "0 6 * * 1"

env:
    CARGO_TERM_COLOR: always

jobs:
    ci:
        name: ${{ matrix.os }}
        runs-on: ${{ matrix.os }}
        if: github.event_name != 'schedule'

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]

        steps:
            - uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.os }}

            - name: Install nextest
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-nextest

            - name: Format check
              if: matrix.os == 'ubuntu-latest'
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Test
              run: cargo nextest run

            - name: Verify the crate packages cleanly
              if: matrix.os == 'ubuntu-latest'
              run: cargo publish --dry-run --locked

    coverage:
        name: Coverage floor
        runs-on: ubuntu-latest
        if: github.event_name != 'schedule'

        steps:
            - uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: llvm-tools-preview

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  key: coverage

            - name: Install cargo-llvm-cov
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-llvm-cov

            - name: Measure and enforce
              run: cargo llvm-cov --summary-only --fail-under-lines 45

    registry-lint-tool:
        name: registry-lint tool
        runs-on: ubuntu-latest
        if: github.event_name != 'schedule'

        defaults:
            run:
                working-directory: tools/registry-lint

        steps:
            - uses: actions/checkout@v7

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt, clippy

            - name: Cache cargo build
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: tools/registry-lint

            - name: Format check
              run: cargo fmt --all -- --check

            - name: Clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Test
              run: cargo test

            - name: Verify the vendored schemas match the server's
              working-directory: .
              env:
                  SCHEMA_BASE_URL: https://anesis-server.onrender.com/schema
              run: |
                  set -euo pipefail
                  failed=0
                  for schema in tools/registry-lint/schemas/*.json; do
                    name=$(basename "$schema")
                    remote="$SCHEMA_BASE_URL/$name"
                    if ! curl --fail --silent --show-error --location "$remote" -o "/tmp/$name"; then
                      echo "::error file=$schema::could not fetch $remote - the drift check for $name did not run"
                      failed=1
                      continue
                    fi
                    # jq normalises key order and whitespace, so a purely cosmetic
                    # difference in the served copy does not fail the build.
                    if ! diff -u <(jq -S . "/tmp/$name") <(jq -S . "$schema"); then
                      echo "::error file=$schema::vendored schema has drifted from the deployed server"
                      failed=1
                    fi
                  done
                  exit "$failed"

    security:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - name: Install cargo-audit and cargo-deny
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit,cargo-deny

            - name: cargo audit
              run: cargo audit

            - name: cargo deny
              run: cargo deny check

            - name: cargo audit (registry-lint tool)
              working-directory: tools/registry-lint
              run: cargo audit
