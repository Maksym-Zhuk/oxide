name: Release

on:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    check:
        name: Check versions
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Verify versions match tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  CARGO_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
                  NPM_VER=$(node -p "require('./npm/package.json').version")
                  [ "$CARGO_VER" = "$VERSION" ] || { echo "Cargo.toml=$CARGO_VER != tag=$VERSION"; exit 1; }
                  [ "$NPM_VER" = "$VERSION" ] || { echo "npm/package.json=$NPM_VER != tag=$VERSION"; exit 1; }

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Verify crates.io packaging
              run: cargo publish --dry-run --locked

    build:
        name: Build & test ${{ matrix.name }}
        needs: check
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write

        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      name: linux-x86_64
                    - os: ubuntu-24.04-arm
                      target: aarch64-unknown-linux-gnu
                      name: linux-aarch64
                    - os: macos-latest
                      target: aarch64-apple-darwin
                      name: macos-aarch64
                    - os: macos-15-intel
                      target: x86_64-apple-darwin
                      name: macos-x86_64
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      name: windows-x86_64

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pkg-config libssl-dev

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  key: ${{ matrix.target }}

            - name: Install cargo-nextest
              uses: taiki-e/install-action@nextest

            - name: Run tests
              run: cargo nextest run --all-features --locked --target ${{ matrix.target }}

            - name: Build release binary
              run: cargo build --release --locked --target ${{ matrix.target }}

            - name: Package (Unix)
              if: runner.os != 'Windows'
              run: |
                  cd target/${{ matrix.target }}/release
                  tar czf ../../../anesis-${{ matrix.name }}.tar.gz anesis

            - name: Package (Windows)
              if: runner.os == 'Windows'
              run: |
                  cd target/${{ matrix.target }}/release
                  7z a ../../../anesis-${{ matrix.name }}.zip anesis.exe

            - name: Upload to release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      anesis-*.tar.gz
                      anesis-*.zip

            - name: Upload archive as workflow artifact
              uses: actions/upload-artifact@v4
              with:
                  name: archive-${{ matrix.name }}
                  path: |
                      anesis-*.tar.gz
                      anesis-*.zip
                  if-no-files-found: error

    checksums:
        name: Publish SHA256SUMS
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Download all archives
              uses: actions/download-artifact@v8
              with:
                  pattern: archive-*
                  merge-multiple: true
                  path: dist

            - name: Generate SHA256SUMS
              working-directory: dist
              run: |
                  shasum -a 256 anesis-* | sort -k2 > SHA256SUMS
                  cat SHA256SUMS

            - name: Upload SHA256SUMS to release
              uses: softprops/action-gh-release@v2
              with:
                  files: dist/SHA256SUMS

    man:
        name: Publish man pages
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            # The binary generates its own pages, so they cannot drift from the
            # command definitions the way a checked-in copy would.
            - name: Generate man pages
              run: |
                  cargo run --release --locked -- man man/
                  tar czf anesis-man.tar.gz man/
                  ls man/

            - name: Upload man pages to release
              uses: softprops/action-gh-release@v2
              with:
                  files: anesis-man.tar.gz

    packaging:
        name: Update Scoop bucket and Homebrew tap
        needs: checksums
        runs-on: ubuntu-latest
        if: ${{ github.repository_owner == 'anesis-dev' }}
        steps:
            - uses: actions/checkout@v4

            - name: Check for the packaging token
              id: gate
              env:
                  PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
              run: |
                  if [ -n "$PACKAGING_TOKEN" ]; then
                    echo "enabled=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "enabled=false" >> "$GITHUB_OUTPUT"
                    echo "PACKAGING_TOKEN is not set - skipping. See packaging/README.md."
                  fi

            - name: Download SHA256SUMS from the release
              if: steps.gate.outputs.enabled == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir .

            - name: Render manifests
              if: steps.gate.outputs.enabled == 'true'
              run: packaging/render.sh "$GITHUB_REF_NAME" SHA256SUMS rendered/

            - name: Push to the Scoop bucket and the Homebrew tap
              if: steps.gate.outputs.enabled == 'true'
              env:
                  PACKAGING_TOKEN: ${{ secrets.PACKAGING_TOKEN }}
                  VERSION: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  git config --global user.name  "anesis-release-bot"
                  git config --global user.email "bot@anesis.dev"

                  push_manifest() {
                    repo="$1" src="$2" dest="$3"
                    work="$(mktemp -d)"
                    git clone --depth 1 \
                      "https://x-access-token:${PACKAGING_TOKEN}@github.com/${repo}.git" "$work"
                    mkdir -p "$work/$(dirname "$dest")"
                    cp "$src" "$work/$dest"
                    git -C "$work" add "$dest"
                    if git -C "$work" diff --cached --quiet; then
                      echo "$repo is already at $VERSION"
                      return
                    fi
                    git -C "$work" commit -m "anesis $VERSION"
                    git -C "$work" push
                  }

                  push_manifest anesis-dev/scoop-anesis    rendered/bucket/anesis.json bucket/anesis.json
                  push_manifest anesis-dev/homebrew-anesis rendered/Formula/anesis.rb  Formula/anesis.rb

    publish-crates:
        name: Publish to crates.io
        needs: checksums
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - name: Publish
              run: cargo publish --locked
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    publish-npm:
        name: Publish to npm
        needs: checksums
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  registry-url: "https://registry.npmjs.org"

            - name: Set version from tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  node -e "
                    const fs = require('fs');
                    const p = JSON.parse(fs.readFileSync('npm/package.json', 'utf8'));
                    p.version = '${VERSION}';
                    p.binaryVersion = '${VERSION}';
                    fs.writeFileSync('npm/package.json', JSON.stringify(p, null, 2) + '\n');
                  "

            - name: Publish
              run: npm publish --access public --provenance
              working-directory: npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
